# Nightly Postgres backup — the job that actually runs in production.
#
# This file used to describe a SQLite backup (sqlite3 .backup of /data/*.db)
# that stopped matching reality when the app moved to Postgres: the job
# deployed on the cluster (`postgres-backup`) was created by hand and never
# committed. This is that job, verbatim in behaviour, plus two fixes:
#
#   1. `pipefail`. The live job ran `pg_dump | gzip` under plain `set -e`,
#      where a pipeline's status is gzip's — so a failed pg_dump still
#      produced a small, valid .gz and printed "backup done".
#   2. Verify BEFORE rotating. The dump must gunzip cleanly and end with
#      pg_dump's completion marker, or the job fails and the 14 older
#      backups are left alone. Previously a run of bad dumps would have
#      rotated every good backup out.
#
# Restore: see DEPLOYMENT.md §6.
#
# LIMIT — the backups sit on the same PVC, same node, same disk as the
# data. That protects against a bad deploy or a mistaken DELETE, not
# against losing the server. An off-server copy is still to be added (see
# the marked line) once a destination is chosen.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: myassistant
spec:
  schedule: "0 21 * * *" # 21:00 UTC = 02:30 IST, nightly
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eo pipefail
                  TS=$(date +%Y%m%d-%H%M%S)
                  OUT="/backups/myassistant-$TS.sql.gz"
                  trap 'rm -f "$OUT.partial"' EXIT # a failed dump leaves nothing behind
                  mkdir -p /backups
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                    -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    | gzip > "$OUT.partial"
                  gzip -t "$OUT.partial"
                  if ! zcat "$OUT.partial" | tail -c 2000 | grep -q "PostgreSQL database dump complete"; then
                    echo "backup INCOMPLETE — keeping the previous backups untouched" >&2
                    rm -f "$OUT.partial"
                    exit 1
                  fi
                  mv "$OUT.partial" "$OUT"
                  # ---- off-server copy goes here (rclone / aws s3 cp) ----
                  ls -t /backups/myassistant-*.sql.gz | tail -n +15 | xargs -r rm --
                  echo "backup done: $(basename "$OUT") ($(ls /backups/myassistant-*.sql.gz | wc -l) kept)"
              envFrom:
                - secretRef:
                    name: postgres-secret
              volumeMounts:
                - name: data
                  mountPath: /backups
                  subPath: backups
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: myassistant-data
