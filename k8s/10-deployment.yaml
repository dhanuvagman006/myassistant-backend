# Deployment for MYASSISTANT_BACKEND — the shape production runs.
#
# ██ DO NOT `kubectl apply` THIS FILE TO PRODUCTION YET. ██
# The live Deployment also carries ~25 env vars set by hand with
# `kubectl set env` — model names, avatar/LiveKit settings AND several
# secrets — which are not (and must not be) in this file. Applying it
# would delete them. Change the live spec with `kubectl patch` until those
# values have been moved into the myassistant-secrets Secret and the
# myassistant-config ConfigMap; after that this file is safe to apply.
#
# Image: built on the VPS and loaded into k3s by scripts/deploy_vps.sh —
# there is no registry, hence imagePullPolicy: Never.
#
# ONE REPLICA. Assistant sessions, agent-call records, rate limits and the
# scheduler live in process memory, so a second pod would split them (see
# DEPLOYMENT.md §4). The PVC is ReadWriteOnce, so it is single-node as well.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myassistant-backend
  namespace: myassistant
  labels:
    app: myassistant-backend
spec:
  replicas: 1 # see header: in-memory state makes more than one unsafe
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: myassistant-backend
  template:
    metadata:
      labels:
        app: myassistant-backend
    spec:
      securityContext:
        fsGroup: 1000 # node user in the image — makes the PVC writable
      containers:
        - name: backend
          image: docker.io/library/myassistant-backend:local
          imagePullPolicy: Never
          # ZERO-DOWNTIME HANDOVER. On SIGTERM the server stops accepting
          # at once, but the ingress keeps routing to this pod for a few
          # seconds while the endpoint removal propagates — which showed up
          # as a 502 during the 2026-09-23 deploy. The pause keeps it
          # serving through that window; 30 s of grace covers pause + drain.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: myassistant-config
            - secretRef:
                name: myassistant-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
            # Push + phone verification credential, from a Secret so it
            # never lands in an image layer.
            - name: firebase
              mountPath: /app/firebase-adminsdk.json
              subPath: firebase-adminsdk.json
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Server exposes GET /health -> {ok:true}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # multer/doc uploads write temp files
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: myassistant-data
        - name: firebase
          secret:
            secretName: firebase-adminsdk
---
apiVersion: v1
kind: Service
metadata:
  name: myassistant-backend
  namespace: myassistant
  labels:
    app: myassistant-backend
spec:
  type: ClusterIP
  selector:
    app: myassistant-backend
  ports:
    - name: http
      port: 80
      targetPort: http
