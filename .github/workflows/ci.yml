# CI — runs on every push and pull request.
# A PR CANNOT be merged into main unless this passes (branch protection).
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Postgres for the suite (the app no longer uses SQLite).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myassistant
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: myassistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myassistant -d myassistant"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://myassistant:ci@localhost:5432/myassistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every route module must at least LOAD (catches typos/bad requires).
      # Globs src/routes/ so the list can never go stale again — a stale
      # hardcoded list is exactly what kept CI red for days.
      - name: Module load check
        run: |
          JWT_SECRET=$(head -c 48 /dev/urandom | base64) DATABASE_URL=$DATABASE_URL node -e "
            const fs = require('fs');
            for (const f of fs.readdirSync('./src/routes'))
              if (f.endsWith('.js')) require('./src/routes/' + f);
            for (const m of ['./src/agents/runtime','./src/live/proxy',
                             './src/services/brief','./src/tools/builtins',
                             './src/commitments/service','./src/services/intents',
                             './src/reminders/routes','./src/google/routes']) require(m);
            console.log('all modules load');"
      # Boot the real server and exercise auth/memory/reminders/google.
      - name: Smoke test
        run: npm test
