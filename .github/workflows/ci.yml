# CI — every push and pull request.
#
# Runs the WHOLE suite (npm run test:all: 13 suites, including the
# security tests) against a real Postgres. Until 2026-09-23 CI ran only the
# smoke test, which is how eight tests in test:all went red unnoticed.
#
# Both repos are checked out side by side, as on a developer machine:
# test:state and test:fulfillment read the app's source
# (../myassistant-flutter) to check that the two halves still agree.
#
# Deployment is not done here: production is an image built on the VPS
# and loaded into k3s (scripts/deploy_vps.sh). The old ci-cd.yml pushed to
# GHCR and ran `kubectl set image` to an image production never uses — had
# its KUBE_CONFIG secret ever been set, it would have broken production.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myassistant
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: myassistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myassistant -d myassistant"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://myassistant:ci@localhost:5432/myassistant
      JWT_SECRET: ci-only-secret-not-used-in-prod-0123456789abcdef
    defaults:
      run:
        working-directory: myassistant-backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: myassistant-backend
      - uses: actions/checkout@v4
        with:
          repository: dhanuvagman006/myassistant-flutter
          path: myassistant-flutter
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Dockerfile
          cache: npm
          cache-dependency-path: myassistant-backend/package-lock.json
      - run: npm ci
      # Every route module must at least LOAD (catches typos/bad requires).
      - name: Module load check
        run: |
          node -e "
            const fs = require('fs');
            for (const f of fs.readdirSync('./src/routes'))
              if (f.endsWith('.js')) require('./src/routes/' + f);
            for (const m of ['./src/agents/runtime','./src/live/proxy',
                             './src/services/brief','./src/tools/builtins',
                             './src/commitments/service','./src/services/intents',
                             './src/reminders/routes','./src/google/routes']) require(m);
            console.log('all modules load');"
      - name: Full test suite
        run: npm run test:all

  # The image must build — production builds from this Dockerfile on the VPS.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
